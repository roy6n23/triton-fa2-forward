name: tests

on:
  push:
  pull_request:

jobs:
  interpreter:
    # No GPU runner: the kernel runs under Triton's CPU interpreter (numpy emulation).
    runs-on: ubuntu-latest
    env:
      TRITON_INTERPRET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install triton numpy pytest
      - name: Test
        run: pytest -rs
